[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavclone"
version = "0.1.0"
description = "Evidence-oriented similarity analysis for architecture-flexible programming assignments."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[project.scripts]
behavclone = "behavclone.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["behavclone*"]
exclude = ["tests*", "datasets*", "experiments*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
